name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build sdist and wheel
        run: uv build

      - name: Check distributions
        run: uv run --with twine twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # OIDC token for PyPI trusted publishing — no API token/secret required.
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish is a Docker container action; its image is
      # published to ghcr.io tagged by release version, NOT by commit SHA, so a
      # raw-SHA pin fails with "manifest unknown". Pin to the immutable release
      # tag instead (PyPA is a trusted publisher).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
