[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "djorm-ext-filtered-contenttypes"
version = "0.5.0"
description = "GenericForeignKey with filtering capabilities for Django ORM + PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Michal Pasternak", email = "michal.dtz@gmail.com"}]
maintainers = [{name = "Michal Pasternak", email = "michal.dtz@gmail.com"}]
keywords = ["django", "orm", "contenttypes", "generic-foreign-key", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "django>=5.2",
]

[project.optional-dependencies]
dev = [
    "psycopg2-binary",
    "bumpver",
]

[project.urls]
Homepage = "https://github.com/mpasternak/djorm-ext-filtered-contenttypes"
Repository = "https://github.com/mpasternak/djorm-ext-filtered-contenttypes"
Issues = "https://github.com/mpasternak/djorm-ext-filtered-contenttypes/issues"

[tool.setuptools]
packages = ["filtered_contenttypes"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.bumpver]
current_version = "0.5.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
